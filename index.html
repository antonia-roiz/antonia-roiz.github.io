<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Idade</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        }

        .calculadora {
            background: white;
            width: 90%;
            max-width: 400px;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #d14d72;
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;

            margin: 15px 0;

            border: 2px solid #ddd;
            border-radius: 10px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #d14d72;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #b83d60;
        }

        #resultado {
            margin-top: 25px;
            color: #d14d72;
        }
    </style>
</head>

<body>

    <div class="calculadora">

        <h1>🎂 Calculadora de Idade</h1>

        <p>Digite seu ano de nascimento:</p>

        <input type="number" id="anoNascimento">

        <button onclick="calcularIdade()">Calcular</button>

        <h2 id="resultado"></h2>

    </div>

    <script>
        function calcularIdade() {

            let anoNascimento = document.getElementById("anoNascimento").value;

            let anoAtual = 2026;

            let idade = anoAtual - anoNascimento;

            document.getElementById("resultado").innerText =
                "Você tem aproximadamente " + idade + " anos! 🎉";
        }
    </script>

</body>

</html>
